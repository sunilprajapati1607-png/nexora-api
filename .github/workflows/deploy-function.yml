# Nexora — build and deploy the licence service as a Supabase Edge Function
# ======================================================================
# The service is ONE fetch(Request) -> Response handler. Render runs it
# through api/server.js; Supabase runs the same handler through
# api/edge/entry.js. This workflow builds the second one and deploys it.
#
# It is deliberately manual (workflow_dispatch). Render deploys itself on
# every push to main and serves every installation up to 4.33; the
# function is what 4.34 will point at. Two front doors on ONE database is
# the plan, not an accident — so the moment the function goes live is a
# decision, not a side effect of an unrelated commit.
#
# BEFORE THE FIRST RUN, add one repository secret:
#
#   SUPABASE_ACCESS_TOKEN   Supabase dashboard -> account -> Access Tokens
#                           Settings -> Secrets and variables -> Actions
#
# The function's own secrets (NEXORA_TOKEN_SECRET, NEXORA_ADMIN_KEY) are
# set once in the Supabase dashboard under Edge Functions -> Secrets.
# SUPABASE_DB_URL is injected by the platform, so the database URL is not
# configuration at all.

name: deploy-function

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref (dzbzcwmxyenztowzcukc = production, xanbgeuwbykfmgulzxuk = the throwaway spike)'
        required: true
        default: xanbgeuwbykfmgulzxuk

concurrency:
  group: deploy-function-${{ github.event.inputs.project_ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The service has no runtime dependencies and keeps none. esbuild is
      # a BUILD tool and postgres is only read for its version, so neither
      # is saved into package.json — Render must keep installing nothing.
      - name: Install the build tools
        run: npm install --no-save esbuild-wasm@0.28.2 postgres@3.4.9

      - name: Build the function
        run: node build-edge.mjs

      - name: Say what is about to be deployed
        run: |
          f="supabase/functions/nexora/index.ts"
          echo "| what | value |"                                   >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |"                                      >> "$GITHUB_STEP_SUMMARY"
          echo "| project | ${{ github.event.inputs.project_ref }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| function | nexora |" >> "$GITHUB_STEP_SUMMARY"
          echo "| size | $(wc -c < "$f") bytes |"                   >> "$GITHUB_STEP_SUMMARY"
          echo "| sha256 | $(sha256sum "$f" | cut -d' ' -f1) |"     >> "$GITHUB_STEP_SUMMARY"
          # node:net and node:tls do not work in the Edge runtime: a function
          # that so much as imports them boots and then dies with no error.
          # build-edge.mjs already refuses to emit them; check the artefact too.
          if grep -qE '"node:(net|tls)"' "$f"; then
            echo "::error::the bundle imports node:net or node:tls, which the Edge runtime cannot run"; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt: the service does its own authentication — licence
      # tokens it signs itself, an admin key for the console, and routes
      # that MUST be open (/health, /v1/activate, /v1/register) because a
      # machine has no token until it has activated. A Supabase JWT gate in
      # front of it would lock out every customer.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set on this repository — see the comment at the top of this file"; exit 1; fi
          supabase functions deploy "nexora" \
            --project-ref "${{ github.event.inputs.project_ref }}" \
            --no-verify-jwt

      - name: Check it answers
        run: |
          base="https://${{ github.event.inputs.project_ref }}.supabase.co/functions/v1/nexora"
          code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 60 --retry 4 --retry-delay 5 --retry-all-errors "$base/health" || echo 000)
          echo "health: HTTP $code  $(head -c 200 body.txt)"
          if [ "$code" != "200" ]; then echo "::error::the deployed function did not answer /health (HTTP $code)"; exit 1; fi
          grep -q '"ok":true' body.txt || { echo "::error::/health answered but did not say ok — the database may be unreachable"; exit 1; }
          # /v1/ink/* runs the schema steps BEFORE authorising, so 401 proves
          # the function reached Postgres. 500 means it did not.
          ink=$(curl -sS -o ink.txt -w '%{http_code}' --max-time 60 "$base/v1/ink/model" || echo 000)
          echo "database through the function: HTTP $ink"
          if [ "$ink" != "401" ]; then echo "::error::expected 401 from /v1/ink/model, got $ink"; head -c 300 ink.txt; exit 1; fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed and answering at \`$base\`" >> "$GITHUB_STEP_SUMMARY"
