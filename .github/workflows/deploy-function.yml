# Nexora — build and deploy the licence service as a Supabase Edge Function
# ======================================================================
# The service is ONE fetch(Request) -> Response handler. Render runs it
# through api/server.js; Supabase runs the same handler through
# api/edge/entry.js. This workflow builds the second one and deploys it.
#
# It is deliberately manual (workflow_dispatch). Render deploys itself on
# every push to main and serves every installation up to 4.33; the
# function is what 4.34 will point at. Two front doors on ONE database is
# the plan, not an accident — so the moment the function goes live is a
# decision, not a side effect of an unrelated commit.
#
# BEFORE THE FIRST RUN, add one repository secret:
#
#   SUPABASE_ACCESS_TOKEN   Supabase dashboard -> account -> Access Tokens
#                           Settings -> Secrets and variables -> Actions
#
# Make it a SCOPED token if the option is offered (those begin sbp_fc),
# scoped to this one project. A classic token carries the whole account:
# every permission, on every organization and project, including ones
# created after the token was made. That is far more than a deploy needs,
# and a secret kept in CI is a secret that can leak.
#
# This is NOT the same as connecting GitHub to Supabase in the dashboard.
# That integration is database BRANCHING — preview branches and
# migrations — and it issues no token to Actions.
#
# The function's own secrets (NEXORA_TOKEN_SECRET, NEXORA_ADMIN_KEY) are
# set once in the Supabase dashboard under Edge Functions -> Secrets.
# SUPABASE_DB_URL is injected by the platform, so the database URL is not
# configuration at all.

name: deploy-function

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref (dzbzcwmxyenztowzcukc = production, xanbgeuwbykfmgulzxuk = the throwaway spike)'
        required: true
        default: dzbzcwmxyenztowzcukc

concurrency:
  group: deploy-function-${{ github.event.inputs.project_ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The service has no runtime dependencies and keeps none. esbuild is
      # a BUILD tool and postgres is only read for its version, so neither
      # is saved into package.json — Render must keep installing nothing.
      - name: Install the build tools
        run: npm install --no-save esbuild-wasm@0.28.2 postgres@3.4.9

      - name: Build the function
        run: node build-edge.mjs

      - name: Say what is about to be deployed
        run: |
          f="supabase/functions/nexora/index.ts"
          echo "| what | value |"                                   >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |"                                      >> "$GITHUB_STEP_SUMMARY"
          echo "| project | ${{ github.event.inputs.project_ref }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| function | nexora |" >> "$GITHUB_STEP_SUMMARY"
          echo "| size | $(wc -c < "$f") bytes |"                   >> "$GITHUB_STEP_SUMMARY"
          echo "| sha256 | $(sha256sum "$f" | cut -d' ' -f1) |"     >> "$GITHUB_STEP_SUMMARY"
          # node:net and node:tls do not work in the Edge runtime: a function
          # that so much as imports them boots and then dies with no error.
          # build-edge.mjs already refuses to emit them; check the artefact too.
          if grep -qE '"node:(net|tls)"' "$f"; then
            echo "::error::the bundle imports node:net or node:tls, which the Edge runtime cannot run"; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt: the service does its own authentication — licence
      # tokens it signs itself, an admin key for the console, and routes
      # that MUST be open (/health, /v1/activate, /v1/register) because a
      # machine has no token until it has activated. A Supabase JWT gate in
      # front of it would lock out every customer.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          ref="${{ github.event.inputs.project_ref }}"
          supabase --version

          # ---- 1. is the token there, and does it look like a token? ----
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set on this repository. GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret. It must be a REPOSITORY secret, and the name must match exactly."
            exit 1
          fi
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN does not begin with sbp_, so it is not a Supabase personal access token. A stray quote, the word Bearer, or a copied newline will do this. Make one at https://supabase.com/dashboard/account/tokens and paste ONLY the token."
               exit 1 ;;
          esac

          # ---- 2. what can the token actually do? ----
          # Asked before deploying, because "the deploy failed" is not a
          # diagnosis. But it is ONLY a diagnosis: nothing below this line
          # stops the deploy except a token the server outright rejects.
          # An earlier version asked GET /v1/projects, which lists the whole
          # ACCOUNT, and then failed the build on 403 — so a token correctly
          # scoped to one project was refused by the check rather than by
          # Supabase. A test that is stricter than the thing it is testing
          # is worse than no test.
          probe=$(curl -sS -o probe.json -w '%{http_code}' --max-time 30 \
                    -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                    "https://api.supabase.com/v1/projects/$ref/functions" || echo 000)
          case "$probe" in
            200) echo "the token reaches Edge Functions on $ref" ;;
            401)
              echo "::error::Supabase rejected the token (401). It is wrong, revoked, or expired. Make a new one at https://supabase.com/dashboard/account/tokens and replace the repository secret. Nothing in production is affected — this token is only used to deploy."
              exit 1 ;;
            403)
              echo "::warning::the token is valid but not permitted to read Edge Functions on $ref (403). If it is a SCOPED token, it needs this project with WRITE access to Edge Functions; a classic token always has it. Trying the deploy anyway — Supabase, not this check, decides." ;;
            404)
              echo "::warning::project $ref is not visible to this token (404) — either the ref is wrong or the token is scoped elsewhere. Trying the deploy anyway." ;;
            *)
              echo "::warning::could not check the token first (HTTP $probe). Trying the deploy anyway."; head -c 200 probe.json || true ;;
          esac

          # ---- 3. are the function's own secrets there? ----
          # NEXORA_TOKEN_SECRET signs every licence token and NEXORA_ADMIN_KEY
          # opens the console. Both default to the empty string, so a function
          # deployed without them ANSWERS — /health is fine, activation is
          # fine — while signing tokens with no secret at all. Worth looking
          # for, and only ever a warning: the names come back, never the
          # values, and a scoped token may not be allowed to ask.
          secrets_code=$(curl -sS -o secrets.json -w '%{http_code}' --max-time 30 \
                           -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                           "https://api.supabase.com/v1/projects/$ref/secrets" || echo 000)
          if [ "$secrets_code" = "200" ]; then
            for name in NEXORA_TOKEN_SECRET NEXORA_ADMIN_KEY; do
              if grep -q "\"$name\"" secrets.json; then echo "  $name is set"
              else echo "::warning::$name is NOT set on $ref. Set it under Edge Functions -> Secrets, to the same value Render uses, or the function will run with an empty one."; fi
            done
          else
            echo "could not list the function's secrets (HTTP $secrets_code) — carrying on"
          fi

          # ---- 4. deploy ----
          # --no-verify-jwt is what older CLI versions want and newer ones
          # have replaced with config.toml (which build-edge.mjs writes
          # either way). Pass it only if this CLI still has it, rather than
          # pinning a version and finding out on some later Tuesday.
          flags=""
          if supabase functions deploy --help 2>&1 | grep -q -- '--no-verify-jwt'; then
            flags="--no-verify-jwt"
          fi
          echo "supabase functions deploy nexora --project-ref $ref $flags"
          if ! supabase functions deploy nexora --project-ref "$ref" $flags --debug; then
            echo "::error::the deploy was refused by Supabase (the CLI's own reason is above; the token check returned HTTP $probe). If that reason is about permissions, the token needs WRITE access to Edge Functions on $ref — a scoped token grants that per project, a classic token has it everywhere. Nothing in production is affected: this token is only used to deploy."
            exit 1
          fi

      - name: Check it answers
        run: |
          base="https://${{ github.event.inputs.project_ref }}.supabase.co/functions/v1/nexora"
          code=$(curl -sS -o body.txt -w '%{http_code}' --max-time 60 --retry 4 --retry-delay 5 --retry-all-errors "$base/health" || echo 000)
          echo "health: HTTP $code  $(head -c 200 body.txt)"
          if [ "$code" != "200" ]; then echo "::error::the deployed function did not answer /health (HTTP $code)"; exit 1; fi
          grep -q '"ok":true' body.txt || { echo "::error::/health answered but did not say ok — the database may be unreachable"; exit 1; }
          # /v1/ink/* runs the schema steps BEFORE authorising, so 401 proves
          # the function reached Postgres. 500 means it did not.
          ink=$(curl -sS -o ink.txt -w '%{http_code}' --max-time 60 "$base/v1/ink/model" || echo 000)
          echo "database through the function: HTTP $ink"
          if [ "$ink" != "401" ]; then echo "::error::expected 401 from /v1/ink/model, got $ink"; head -c 300 ink.txt; exit 1; fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed and answering at \`$base\`" >> "$GITHUB_STEP_SUMMARY"
